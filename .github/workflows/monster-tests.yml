name: Monster detector tests
on:
  push:
    branches: [feature/spy-monster-detector-20261112]
  pull_request:
    paths:
      - 'functions/api/monster.js'
      - 'functions/lib/monster-core.js'
      - 'tests/**'
      - 'package.json'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
